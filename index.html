<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Markdown Preview</title>
    <style>
      body {
        margin: 0;
      }
      .container {
        display: flex;
        height: 100vh;
      }
      .editor,
      .preview {
        flex: 1;
        padding: 16px;
        box-sizing: border-box;
      }
      .editor {
        border: none;
        border-right: 1px solid #ccc;
        resize: none;
        font-family: monospace;
        font-size: 14px;
      }
      .preview {
        overflow-y: auto;
      }
      .preview pre {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
      }
      .preview code {
        font-family: monospace;
      }
      .preview table {
        border-collapse: collapse;
      }
      .preview th,
      .preview td {
        border: 1px solid #ccc;
        padding: 6px 12px;
      }
    </style>
  </head>
  <body></body>
</html>
